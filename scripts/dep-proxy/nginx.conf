# nginx.conf — local caching Maven/Gradle repository proxy (#331)
#
# Reverse-proxies + caches two upstream JVM artifact repositories:
#   /maven2/         -> https://repo.maven.apache.org/maven2/    (Maven Central)
#   /gradle-plugins/ -> https://plugins.gradle.org/m2/           (Gradle Plugin Portal)
#
# proxy_cache_lock is the feature this whole issue rests on: when several
# concurrent requests miss the cache for the same URI, only the first is
# sent upstream — the rest block on the lock and are served from cache once
# it lands, instead of each firing its own upstream request. That's what
# collapses N fresh workers hitting the same never-cached artifact (e.g. a
# same-second dependency version bump) into ~1 upstream fetch instead of N
# (the failure mode behind #329).
#
# Run via ../dep-proxy.sh, not directly — that script owns the container
# lifecycle, port binding, and on-disk cache directory.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx/maven2 levels=2:2 keys_zone=maven2:10m max_size=20g inactive=60d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/gradle-plugins levels=2:2 keys_zone=gradle_plugins:10m max_size=5g inactive=60d use_temp_path=off;

    # Docker's embedded DNS (127.0.0.11 on the default bridge network) so the
    # upstream hostnames below re-resolve periodically instead of being
    # baked in once at nginx startup (Fastly, which fronts both upstreams,
    # rotates IPs).
    resolver 127.0.0.11 valid=300s ipv6=off;

    proxy_cache_lock on;
    # Generous: a cold jar/pom fetch can take longer than nginx's 5s default
    # lock timeout, especially for large boot/kotlin artifacts. A waiter that
    # times out falls through to fetching upstream itself (see
    # proxy_cache_lock_timeout docs) — better a rare duplicate fetch than a
    # blocked build, but keep this high so it stays rare.
    proxy_cache_lock_timeout 120s;
    proxy_cache_lock_age 120s;

    proxy_cache_valid 200 302 30d;
    # Maven/Gradle release artifacts are immutable once published, but a 404
    # can be a transient upstream hiccup (or an artifact published moments
    # after this request) — don't let a bad negative cache outlive that.
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;

    log_format cache_log
        '$remote_addr [$time_local] "$request" $status '
        'cache=$upstream_cache_status bytes_sent=$body_bytes_sent '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log cache_log;

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Regex-capture + explicit path rebuild, NOT a plain `location /x/ {
        # proxy_pass https://$host/y/; }`: once proxy_pass's target contains a
        # variable (needed so `resolver` can re-resolve the upstream
        # periodically, see above), nginx stops doing its usual
        # location-prefix-for-proxy_pass-prefix substitution and passes the
        # literal proxy_pass string with nothing appended — every request,
        # regardless of the requested artifact, silently fetched the
        # upstream's bare root instead (caught in testing: every "200 OK"
        # was actually the Maven Central / Plugin Portal root directory
        # listing, not the artifact). Capturing the remainder ourselves and
        # appending it explicitly avoids relying on that substitution.
        location ~ ^/maven2/(.*)$ {
            proxy_cache maven2;
            proxy_cache_key $uri;
            proxy_cache_valid 200 302 30d;

            set $upstream_host repo.maven.apache.org;
            proxy_set_header Host $upstream_host;
            proxy_ssl_server_name on;
            proxy_ssl_name $upstream_host;
            proxy_pass https://$upstream_host/maven2/$1$is_args$args;
        }

        location ~ ^/gradle-plugins/(.*)$ {
            proxy_cache gradle_plugins;
            proxy_cache_key $uri;
            proxy_cache_valid 200 302 30d;

            set $upstream_host plugins.gradle.org;
            proxy_set_header Host $upstream_host;
            proxy_ssl_server_name on;
            proxy_ssl_name $upstream_host;
            proxy_pass https://$upstream_host/m2/$1$is_args$args;
        }
    }
}
